# Compila el instalador de Windows al subir una etiqueta vX.Y.Z y lo adjunta a una release de GitHub.
# Solo usa el GITHUB_TOKEN que GitHub da a cada ejecución (no hace falta ningún secreto propio).
name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      # (la comprobación de tipos necesita un proyecto Remotion al lado, ../montilla-video, que no está en el repo)

      - name: Navegador incluido (chrome-headless-shell)
        run: npm run chrome

      - name: Compilar y publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
