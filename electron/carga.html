<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cargando</title>
    <!-- Pantalla de carga con el «trazo de marca» de metricaseo.site (BrandTracePreloader):
         la M se dibuja, se desliza, aparece el punto y se revela «etricaseo». Fuentes locales. -->
    <style>
      @font-face { font-family: 'Poppins'; font-weight: 600; src: url('./fuentes/poppins-logo-v1.woff2') format('woff2'); }
      @font-face { font-family: 'Inter Tight'; font-weight: 500 700; src: url('./fuentes/inter-tight-latin-v1.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 400 700; src: url('./fuentes/inter-latin-v1.woff2') format('woff2'); }
      :root { --bg: #f3f3f3; --ink: #212121; --muted: #5c5c5c; --line: #e2e2e2; --green: #12a150; --pill: #212121; --pill-ink: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121212; --ink: #f3f3f3; --muted: #a6a6a6; --line: #2c2c2c; --green: #74f5a1; --pill: #f3f3f3; --pill-ink: #121212; }
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px 'Inter', 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-app-region: drag; }
      .caja { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .marca { display: flex; align-items: center; gap: 14px; }
      .logo { display: inline-flex; align-items: baseline; font: 600 44px/1 'Poppins', system-ui, sans-serif; letter-spacing: -0.02em; }
      .logo svg { width: 1.033em; height: 1.04em; margin-right: -0.27em; overflow: visible; flex-shrink: 0; animation: logoShift 550ms cubic-bezier(.22,1,.36,1) 650ms both; }
      .logo path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawM 650ms cubic-bezier(.22,1,.36,1) 100ms forwards; }
      .logo circle { fill: var(--green); opacity: 0; transform-origin: 42.8px 16.6px; animation: dotFade 220ms ease 1070ms forwards; }
      .logo .palabra { display: inline-block; opacity: 0; clip-path: inset(-30% 100% -30% 0); animation: revealWord 550ms cubic-bezier(.22,1,.36,1) 800ms forwards; }
      .logo b { font-weight: 600; color: var(--green); }
      .studio { opacity: 0; padding: 5px 11px; border-radius: 999px; background: var(--pill); color: var(--pill-ink); font: 600 13px/1 'Inter Tight', system-ui, sans-serif; letter-spacing: -0.01em; animation: aparece 400ms ease 1250ms forwards; }
      .barra { width: 240px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; opacity: 0; animation: aparece 300ms ease 1300ms forwards; }
      .barra i { display: block; width: 36%; height: 100%; background: var(--green); border-radius: 3px; animation: ir 1.2s cubic-bezier(.45,0,.55,1) infinite; }
      p { margin: 0; color: var(--muted); font-size: 12px; opacity: 0; animation: aparece 300ms ease 1350ms forwards; max-width: 380px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @keyframes drawM { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes logoShift { from { transform: translateX(55px); } to { transform: translateX(0); } }
      @keyframes revealWord { 0% { opacity: 0; clip-path: inset(-30% 100% -30% 0); transform: translateX(8px); } 100% { opacity: 1; clip-path: inset(-30% 0% -30% 0); transform: translateX(0); } }
      @keyframes dotFade { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes aparece { to { opacity: 1; } }
      @keyframes ir { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; animation-delay: 0ms !important; } }
    </style>
  </head>
  <body>
    <div class="caja" role="status" aria-live="polite">
      <div class="marca">
        <span class="logo" aria-label="MétricaSEO">
          <svg viewBox="5.25 6 36.51 36.75" aria-hidden="true">
            <path d="M8 40 V18 L21 31 L32.37 19.63" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" />
            <circle cx="42.8" cy="16.6" r="3.53" fill="#12a150" />
          </svg>
          <span class="palabra">etrica<b>seo</b></span>
        </span>
        <span class="studio">Studio</span>
      </div>
      <div class="barra"><i></i></div>
      <p id="estado">Abriendo el proyecto y preparando la vista previa…</p>
    </div>
  </body>
</html>
